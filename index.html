<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IndicF5 TTS Local UI</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      padding: 30px 16px;
    }
    .card {
      background: #1e293b;
      padding: 28px;
      border-radius: 12px;
      width: 100%;
      max-width: 580px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h2 {
      margin-top: 0;
      color: #38bdf8;
    }
    label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
      font-size: 0.88rem;
      color: #94a3b8;
    }
    textarea, input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #0284c7;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
    #outputSection {
      margin-top: 24px;
      display: none;
    }
    audio { width: 100%; margin-top: 8px; }
    .status { margin-top: 12px; font-size: 0.85rem; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="card">
    <h2>IndicF5 TTS Studio (Offline Local)</h2>

    <label for="text">Target Text (Text to Speak):</label>
    <textarea id="text" rows="3" placeholder="नमस्ते! आप आज कैसे हैं?"></textarea>

    <label for="refAudio">Reference Audio File (.wav):</label>
    <input type="file" id="refAudio" accept="audio/wav,audio/mp3,audio/*" />

    <label for="refText">Reference Audio Transcript:</label>
    <input type="text" id="refText" placeholder="Exact words spoken in the reference audio above" />

    <button id="runBtn" onclick="synthesize()">Generate Voice</button>

    <div id="status" class="status"></div>

    <div id="outputSection">
      <label>Generated Result:</label>
      <audio id="audioPlayer" controls></audio>
    </div>
  </div>

  <script>
    async function synthesize() {
      const text = document.getElementById('text').value.trim();
      const refText = document.getElementById('refText').value.trim();
      const refAudio = document.getElementById('refAudio').files[0];
      const status = document.getElementById('status');
      const btn = document.getElementById('runBtn');
      const outputSection = document.getElementById('outputSection');
      const audioPlayer = document.getElementById('audioPlayer');

      if (!text) {
        alert('Please enter text to synthesize.');
        return;
      }
      if (!refAudio || !refText) {
        alert('IndicF5 requires both a Reference Audio clip and its exact Transcript to mimic the voice.');
        return;
      }

      btn.disabled = true;
      status.innerText = 'Synthesizing with local IndicF5... Please wait.';
      outputSection.style.display = 'none';

      const formData = new FormData();
      formData.append('text', text);
      formData.append('ref_text', refText);
      formData.append('ref_audio', refAudio);

      try {
        const res = await fetch('http://127.0.0.1:8000/synthesize', {
          method: 'POST',
          body: formData
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({ detail: res.statusText }));
          throw new Error(errData.detail || 'Inference error');
        }

        const blob = await res.blob();
        audioPlayer.src = URL.createObjectURL(blob);
        outputSection.style.display = 'block';
        status.innerText = 'Finished successfully!';
      } catch (err) {
        status.innerText = 'Error: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
